[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-second-brain"
version = "0.2.0"
description = "Personal coding workflow memory for Windows and OpenCode"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
brain = "second_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
